services:
  api:
    build: .
    command: ["uv", "run", "uvicorn", "cucciolofinder.api:app", "--host", "0.0.0.0", "--port", "8000"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  worker:
    build: .
    command: ["uv", "run", "python", "-m", "cucciolofinder.main"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data:/app/data
      - ./data/models:/home/appuser/.cache/huggingface
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    profiles: ["worker"]
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 6G
