name: Full Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        default: worker
        options:
          - worker
          - api
          - both

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Full deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/cucciolofinder

            git status --short
            test -z "$(git status --short)" || {
              echo "ERROR: Server working tree is dirty. Refusing deploy."
              echo "Local changes:"
              git status --short
              exit 1
            }

            git pull origin main

            # Stop and remove target containers/images
            if [ "${{ inputs.target }}" = "worker" ] || [ "${{ inputs.target }}" = "both" ]; then
              docker compose --profile worker down
              docker image rm cucciolofinder-worker 2>/dev/null || true
            fi
            if [ "${{ inputs.target }}" = "api" ] || [ "${{ inputs.target }}" = "both" ]; then
              docker compose down api
              docker image rm cucciolofinder-api 2>/dev/null || true
            fi

            # Cleanup
            docker system prune -a -f
            docker builder prune -a -f

            # Rebuild targets
            if [ "${{ inputs.target }}" = "worker" ] || [ "${{ inputs.target }}" = "both" ]; then
              docker compose --profile worker build worker --no-cache
            fi
            if [ "${{ inputs.target }}" = "api" ] || [ "${{ inputs.target }}" = "both" ]; then
              docker compose build api --no-cache
              docker compose up -d api
            fi
            echo "Full deploy (${{ inputs.target }}) complete at $(date)"
