name: Quick Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        default: worker
        options:
          - worker
          - api
          - both

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Quick deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/cucciolofinder

            git status --short
            test -z "$(git status --short)" || {
              echo "ERROR: Server working tree is dirty. Refusing deploy."
              echo "Local changes:"
              git status --short
              exit 1
            }

            git pull origin main
            docker compose --profile worker build worker
            docker image prune -f
            if [ "${{ inputs.target }}" = "api" ] || [ "${{ inputs.target }}" = "both" ]; then
              docker compose down api
              docker compose build api
              docker compose up -d api
            fi
            echo "Quick deploy (${{ inputs.target }}) complete at $(date)"
